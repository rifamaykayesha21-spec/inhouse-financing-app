<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Akuntansi Piutang In-House Financing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistem Akuntansi Piutang Properti</h1>
            <p>Manajemen Angsuran In-House Financing</p>
        </header>

        <section class="card">
            <h2>Pencatatan Pembayaran Angsuran</h2>
            <form id="form-pembayaran">
                <div class="form-group">
                    <label for="jadwal_id">ID Jadwal Angsuran:</label>
                    <input type="text" id="jadwal_id" required placeholder="Masukkan ID Jadwal">
                </div>
                <div class="form-group">
                    <label for="nomor_kwitansi">Nomor Kwitansi:</label>
                    <input type="text" id="nomor_kwitansi" required placeholder="KW-20261001">
                </div>
                <div class="form-group">
                    <label for="jumlah_dibayar">Jumlah Dibayar (Rp):</label>
                    <input type="number" id="jumlah_dibayar" required min="0" step="any">
                </div>
                <button type="submit" id="btn-simpan">Catat Pembayaran</button>
            </form>
        </section>

        <section class="card">
            <h2>Buku Besar Pembantu Piutang (Jadwal Angsuran)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Kontrak ID</th>
                            <th>Angsuran Ke</th>
                            <th>Jatuh Tempo</th>
                            <th>Pokok</th>
                            <th>Bunga</th>
                            <th>Total Tagihan</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-angsuran-body">
                        <tr>
                            <td colspan="7" class="text-center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- CDN Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Script Frontend -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
